spring.application.name=nexusmarket
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nexusmarket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexusmarket_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/nexusmarket}

# JWT (Security Adapter). El secreto debe tener al menos 32 bytes para HS256.
# En produccion se sobreescribe con la variable de entorno APP_SECURITY_JWT_SECRET.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:nexusmarket-dev-secret-key-change-me-please-0123456789abcdef}
app.security.jwt.expiration-ms=${APP_SECURITY_JWT_EXPIRATION_MS:3600000}
